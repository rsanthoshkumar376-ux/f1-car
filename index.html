<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Algorithmic: Spectral Racer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Matter.js for Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Three.js for 3D Menu -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- 3D Menu Background -->
        <canvas id="menu3dCanvas"></canvas>
        <canvas id="gameCanvas"></canvas>
        
        <!-- Algorithmic Data Stream Overlay -->
        <div id="data-stream" class="spectral-overlay"></div>
        <div id="active-formula" class="formula-overlay"></div>
        
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-top">
                <div class="score-container">
                    <span class="label">SCORE</span>
                    <span id="score-value">000000</span>
                </div>
                <div class="coin-container">
                    <span class="label">COINS</span>
                    <span id="coin-value">0</span>
                    <div id="combo-multiplier" class="hidden">x2</div>
                </div>
                <div class="entropy-container">
                    <span class="label">ENTROPY</span>
                    <span id="entropy-value">0.00</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="speed-meter">
                    <div id="speed-bar"></div>
                    <span class="label">SPEED</span>
                </div>
                <div class="powerups-container" id="active-powerups">
                    <!-- Powerups appear here -->
                </div>
                <div id="gravity-status" class="normal">
                    <div class="gravity-icon">↑</div>
                    <span class="label">GRAVITY</span>
                </div>
            </div>
            <div class="hud-controls">
                <button id="autopilot-btn">AI_PILOT</button>
                <button id="pause-btn">II</button>
            </div>
        </div>

        <!-- Screens -->
        <div id="start-screen" class="screen">
            <div class="title-container">
                <h1>FORMULA<span>ALGORITHMIC</span></h1>
                <p class="subtitle">PREPARING SECTOR CALCULATIONS...</p>
            </div>
            <div class="menu-options">
                <button id="start-btn" class="primary-btn">INITIALIZE DRIVE</button>
                <button id="levels-btn" class="secondary-btn">SECTOR SELECT</button>
                <button id="garage-btn" class="secondary-btn">GARAGE</button>
            </div>
            <div class="controls-hint">
                <p>WASD / ARROWS to Drive</p>
                <p>SPACE to Flip Gravity</p>
                <p>N for Nitro</p>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 class="critical">CHASSIS TERMINATED</h1>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="label">DISTANCE</span>
                    <span id="final-distance">0m</span>
                </div>
                <div class="stat-item">
                    <span class="label">COINS</span>
                    <span id="final-coins">0</span>
                </div>
                <div class="stat-item highlight">
                    <span class="label">TOTAL SCORE</span>
                    <span id="final-score">0</span>
                </div>
            </div>
            <div class="menu-options">
                <button id="retry-btn" class="primary-btn">REBOOT</button>
                <button id="main-menu-btn" class="secondary-btn">TERMINAL</button>
            </div>
        </div>

        <div id="levels-screen" class="screen hidden">
            <h1 class="glitch" data-text="SECTORS">SECTORS</h1>
            <div id="levels-grid" class="levels-grid">
                <!-- Level buttons generated by JS -->
            </div>
            <button id="back-to-menu-levels-btn" class="secondary-btn" style="margin-top: 2rem;">RETURN TO TERMINAL</button>
        </div>

        <div id="garage-screen" class="screen hidden">
            <h1 class="glitch" data-text="SPECTRAL WORKSHOP">WORKSHOP</h1>
            <div id="garage-grid" class="levels-grid">
                <!-- Car cards generated by JS -->
            </div>
            <button id="back-to-menu-garage-btn" class="secondary-btn" style="margin-top: 2rem;">RETURN TO TERMINAL</button>
        </div>

        <div id="pause-screen" class="screen hidden">
            <h1>PAUSED</h1>
            <div class="menu-options">
                <button id="resume-btn" class="primary-btn">RESUME</button>
                <button id="quit-btn" class="secondary-btn">ABORT</button>
            </div>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="js/world.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/garage.js"></script>
    <script src="js/vehicle.js"></script>
    <script src="js/track.js"></script>
    <script src="js/gameplay.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/menu3d.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
