<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Algorithmic: Spectral Racer</title>
    <meta name="description" content="A deterministic, seed-based F1 racing game powered by algorithmic physics.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050310;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* ===== HUD ===== */
        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.2rem 2rem;
        }

        .hud-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(32,255,119,0.3);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .hud-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: rgba(32,255,119,0.6);
            letter-spacing: 3px;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #20ff77;
            text-shadow: 0 0 10px #20ff77;
        }

        #speed-bar-wrap {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            width: 200px;
        }

        #speed-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: rgba(32,255,119,0.6);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        #speed-track {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(32,255,119,0.3);
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
        }

        #speed-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #20ff77, #00ccff);
            border-radius: 20px;
            box-shadow: 0 0 8px #20ff77;
            transition: width 0.1s;
        }

        #gravity-indicator {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #20ff77;
            text-shadow: 0 0 15px #20ff77;
            transition: transform 0.3s;
        }

        #controls-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        #combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        /* ===== SCREENS ===== */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 3, 16, 0.92);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .screen.hidden { display: none; }

        #start-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            color: #20ff77;
            text-shadow: 0 0 40px #20ff77, 0 0 80px rgba(32,255,119,0.3);
            letter-spacing: 6px;
            animation: pulse 2s infinite;
        }

        #start-screen h1 span {
            color: #8822ff;
            text-shadow: 0 0 40px #8822ff;
        }

        @keyframes pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.7rem, 2vw, 1rem);
            color: #8822ff;
            letter-spacing: 8px;
            margin: 0.8rem 0 3rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: min(320px, 80vw);
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            transition: all 0.2s;
        }

        .btn-primary {
            background: #20ff77;
            color: #050310;
            box-shadow: 0 0 20px rgba(32,255,119,0.5);
        }

        .btn-primary:hover {
            background: #40ffaa;
            box-shadow: 0 0 35px rgba(32,255,119,0.8);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(136,34,255,0.15);
            color: #8822ff;
            border: 1px solid rgba(136,34,255,0.4);
        }

        .btn-secondary:hover {
            background: rgba(136,34,255,0.3);
            border-color: #8822ff;
            box-shadow: 0 0 20px rgba(136,34,255,0.4);
        }

        .controls-info {
            margin-top: 2.5rem;
            display: flex;
            gap: 2rem;
            color: rgba(255,255,255,0.35);
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .controls-info span { color: #20ff77; }

        /* GAME OVER */
        #game-over-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 4rem);
            color: #ff3131;
            text-shadow: 0 0 40px #ff3131;
            letter-spacing: 6px;
            margin-bottom: 2.5rem;
        }

        #game-over-screen h1.win {
            color: #20ff77;
            text-shadow: 0 0 40px #20ff77;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.2rem 2rem;
            text-align: center;
            border-radius: 4px;
        }

        .stat-box .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 4px;
            display: block;
            margin-bottom: 0.4rem;
        }

        .stat-box .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #20ff77;
        }

        /* NOTIFICATION */
        #notification {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.4s;
        }

        /* PAUSE SCREEN */
        #pause-screen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #20ff77;
            text-shadow: 0 0 30px #20ff77;
            letter-spacing: 10px;
            margin-bottom: 2rem;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
    <div class="hud-top">
        <div class="hud-box">
            <div class="hud-label">SCORE</div>
            <div class="hud-value" id="score-display">000000</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">COINS</div>
            <div class="hud-value" id="coins-display">0</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">DISTANCE</div>
            <div class="hud-value" id="dist-display">0m</div>
        </div>
    </div>
    <div id="speed-bar-wrap">
        <div id="speed-label">VELOCITY</div>
        <div id="speed-track"><div id="speed-bar"></div></div>
    </div>
    <div id="gravity-indicator">↑</div>
    <div id="controls-hint">A/D DRIVE &nbsp;|&nbsp; SPACE FLIP GRAVITY &nbsp;|&nbsp; N NITRO</div>
    <div id="combo-display"></div>
</div>

<!-- NOTIFICATION -->
<div id="notification"></div>

<!-- START SCREEN -->
<div id="start-screen" class="screen">
    <h1>FORMULA<span>ALGORITHMIC</span></h1>
    <p class="subtitle">SPECTRAL RACER</p>
    <div class="btn-container">
        <button class="btn btn-primary" id="start-btn">INITIALIZE DRIVE</button>
        <button class="btn btn-secondary" id="garage-btn">SPECTRAL WORKSHOP</button>
    </div>
    <div class="controls-info">
        <div><span>A/D</span> DRIVE</div>
        <div><span>SPACE</span> FLIP GRAVITY</div>
        <div><span>N</span> NITRO</div>
    </div>
</div>

<!-- GARAGE SCREEN -->
<div id="garage-screen" class="screen hidden">
    <h1 style="font-family:'Orbitron',sans-serif;font-size:2.5rem;color:#8822ff;text-shadow:0 0 30px #8822ff;letter-spacing:6px;margin-bottom:2rem;">WORKSHOP</h1>
    <div id="garage-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;width:min(900px,90vw);max-height:60vh;overflow-y:auto;padding:0.5rem;"></div>
    <button class="btn btn-secondary" id="garage-back-btn" style="margin-top:2rem;pointer-events:all;">BACK</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="game-over-screen" class="screen hidden">
    <h1 id="game-over-title">DRIVE TERMINATED</h1>
    <div class="stats-grid">
        <div class="stat-box">
            <span class="label">DISTANCE</span>
            <div class="value" id="final-distance">0m</div>
        </div>
        <div class="stat-box">
            <span class="label">COINS</span>
            <div class="value" id="final-coins">0</div>
        </div>
        <div class="stat-box">
            <span class="label">SCORE</span>
            <div class="value" id="final-score">0</div>
        </div>
    </div>
    <div class="btn-container">
        <button class="btn btn-primary" id="retry-btn">REBOOT</button>
        <button class="btn btn-secondary" id="menu-btn">MAIN TERMINAL</button>
    </div>
</div>

<!-- PAUSE SCREEN -->
<div id="pause-screen" class="screen hidden">
    <h2>PAUSED</h2>
    <div class="btn-container">
        <button class="btn btn-primary" id="resume-btn">RESUME</button>
        <button class="btn btn-secondary" id="pause-menu-btn">MAIN TERMINAL</button>
    </div>
</div>

<!-- Matter.js Physics -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<!-- Game Script - Single self-contained file -->
<script src="js/game.js"></script>

</body>
</html>
