<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FA Racer">
    <meta name="theme-color" content="#050310">
    <title>Formula Algorithmic: Spectral Racer</title>
    <meta name="description" content="A deterministic, seed-based F1 racing game. Drive, flip gravity, collect coins.">
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --green: #20ff77;
            --purple: #8822ff;
            --red: #ff3131;
            --gold: #ffd700;
            --bg: #050310;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }

        /* ══════════ HUD ══════════ */
        #hud {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 16px 0;
            padding-top: max(env(safe-area-inset-top, 0px), 12px);
            gap: 8px;
        }

        .hud-box {
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(32,255,119,0.25);
            border-radius: 6px;
            padding: 5px 12px;
            text-align: center;
            backdrop-filter: blur(6px);
            flex: 1;
        }

        .hud-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.45rem;
            letter-spacing: 3px;
            color: rgba(32,255,119,0.55);
            line-height: 1;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 3.5vw, 1.3rem);
            color: var(--green);
            text-shadow: 0 0 10px var(--green);
            line-height: 1.2;
        }

        /* Speed bar */
        #speed-wrap {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom, 0px), 140px);
            left: 16px;
            width: min(160px, 30vw);
            pointer-events: none;
            z-index: 20;
        }
        #speed-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.45rem;
            letter-spacing: 3px;
            color: rgba(32,255,119,0.5);
            margin-bottom: 3px;
        }
        #speed-track {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(32,255,119,0.2);
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
        }
        #speed-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--green), #00ccff);
            border-radius: 20px;
            box-shadow: 0 0 6px var(--green);
            transition: width 0.1s;
        }

        /* Gravity */
        #grav-icon {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom, 0px), 140px);
            right: 16px;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            color: var(--green);
            text-shadow: 0 0 12px var(--green);
            pointer-events: none;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        /* Notification */
        #notification {
            position: fixed;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.75rem, 3vw, 1.1rem);
            letter-spacing: 3px;
            color: var(--gold);
            text-shadow: 0 0 16px var(--gold);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.4s;
            white-space: nowrap;
        }

        /* Combo */
        #combo-pop {
            position: fixed;
            top: 38%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 6vw, 3rem);
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.4s;
        }

        /* ══════════ MOBILE CONTROLS ══════════ */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: max(env(safe-area-inset-bottom, 0px) + 130px, 130px);
            z-index: 25;
            pointer-events: none;
        }

        .ctrl-btn {
            position: absolute;
            background: rgba(32,255,119,0.08);
            border: 2px solid rgba(32,255,119,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--green);
            user-select: none;
            pointer-events: all;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s, border-color 0.1s, transform 0.1s;
            cursor: pointer;
        }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(32,255,119,0.25);
            border-color: var(--green);
            transform: scale(0.93);
            box-shadow: 0 0 18px rgba(32,255,119,0.4);
        }

        #btn-left  { bottom: max(env(safe-area-inset-bottom,0px)+16px,16px); left:16px; width:72px;height:72px; }
        #btn-right { bottom: max(env(safe-area-inset-bottom,0px)+16px,16px); left:104px; width:72px;height:72px; }
        #btn-flip  {
            bottom: max(env(safe-area-inset-bottom,0px)+16px,16px);
            right: 16px;
            width: 90px; height: 90px;
            background: rgba(136,34,255,0.12);
            border-color: rgba(136,34,255,0.4);
            color: #cc88ff;
            font-size: 2rem;
        }
        #btn-flip:active, #btn-flip.active {
            background: rgba(136,34,255,0.3);
            border-color: var(--purple);
            box-shadow: 0 0 20px rgba(136,34,255,0.5);
        }
        #btn-nitro {
            bottom: max(env(safe-area-inset-bottom,0px)+104px,104px);
            right: 24px;
            width: 56px; height: 56px;
            background: rgba(255,100,0,0.1);
            border-color: rgba(255,150,0,0.4);
            color: #ff9900;
            font-size: 1.3rem;
        }
        #btn-nitro:active, #btn-nitro.active {
            background: rgba(255,100,0,0.3);
            border-color: #ff9900;
            box-shadow: 0 0 16px rgba(255,150,0,0.5);
        }

        /* Show on touch devices */
        @media (pointer: coarse) {
            #mobile-controls { display: block; }
            #speed-wrap { bottom: max(env(safe-area-inset-bottom, 0px), 170px); }
            #grav-icon  { display: none; }
        }

        /* ══════════ SCREENS ══════════ */
        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5,3,16,0.93);
            backdrop-filter: blur(14px);
            z-index: 100;
            padding: 1rem;
            padding-top: max(env(safe-area-inset-top,0px) + 1rem, 1rem);
            padding-bottom: max(env(safe-area-inset-bottom,0px) + 1rem, 1rem);
        }

        .screen.hidden { display: none; }

        /* Start screen */
        #start-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 9vw, 5rem);
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 40px var(--green), 0 0 80px rgba(32,255,119,0.25);
            letter-spacing: clamp(2px, 2vw, 8px);
            line-height: 1;
            text-align: center;
            animation: titlePulse 2.5s ease-in-out infinite;
        }

        #start-screen h1 span { color: var(--purple); text-shadow: 0 0 40px var(--purple); }

        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50%       { filter: brightness(1.25); }
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.6rem, 2vw, 0.9rem);
            color: var(--purple);
            letter-spacing: clamp(4px, 3vw, 10px);
            margin: 0.6rem 0 2.5rem;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: min(300px, 85vw);
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            padding: clamp(0.7rem, 3vw, 1rem) 1.5rem;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            font-weight: 700;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: var(--green);
            color: #050310;
            box-shadow: 0 0 20px rgba(32,255,119,0.4);
        }
        .btn-primary:hover, .btn-primary:active {
            background: #40ffaa;
            box-shadow: 0 0 35px rgba(32,255,119,0.7);
            transform: scale(1.04);
        }

        .btn-secondary {
            background: rgba(136,34,255,0.12);
            color: #cc88ff;
            border: 1px solid rgba(136,34,255,0.35);
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: rgba(136,34,255,0.28);
            border-color: var(--purple);
            box-shadow: 0 0 18px rgba(136,34,255,0.35);
        }

        .key-hints {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem 2rem;
            color: rgba(255,255,255,0.25);
            font-size: 0.65rem;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }
        .key-hints span { color: var(--green); }

        /* Game Over */
        #game-over-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 6vw, 3.5rem);
            color: var(--red);
            text-shadow: 0 0 35px var(--red);
            letter-spacing: 5px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        #game-over-screen h1.win { color: var(--green); text-shadow: 0 0 35px var(--green); }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: clamp(0.7rem, 2vw, 1rem) clamp(1rem, 3vw, 1.8rem);
            text-align: center;
            min-width: 80px;
        }
        .stat-box .lbl {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.35);
            display: block;
            margin-bottom: 4px;
        }
        .stat-box .val {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.3rem, 5vw, 2rem);
            color: var(--green);
        }

        /* Pause */
        #pause-screen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: var(--green);
            text-shadow: 0 0 30px var(--green);
            letter-spacing: 8px;
            margin-bottom: 2rem;
        }

        /* Garage */
        .garage-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            color: var(--purple);
            text-shadow: 0 0 30px var(--purple);
            letter-spacing: 5px;
            margin-bottom: 1.5rem;
        }

        #garage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
            width: min(860px, 95vw);
            max-height: 55vh;
            overflow-y: auto;
            padding: 0.25rem;
        }

        /* Scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- ══════════ HUD ══════════ -->
<div id="hud">
    <div class="hud-top">
        <div class="hud-box">
            <div class="hud-label">SCORE</div>
            <div class="hud-value" id="score-display">000000</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">COINS</div>
            <div class="hud-value" id="coins-display">0</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">DISTANCE</div>
            <div class="hud-value" id="dist-display">0m</div>
        </div>
    </div>
</div>

<div id="speed-wrap">
    <div id="speed-label">VELOCITY</div>
    <div id="speed-track"><div id="speed-bar"></div></div>
</div>

<div id="grav-icon">↑</div>
<div id="notification"></div>
<div id="combo-pop"></div>

<!-- ══════════ MOBILE CONTROLS ══════════ -->
<div id="mobile-controls">
    <button class="ctrl-btn" id="btn-left"  aria-label="Drive Left">◀</button>
    <button class="ctrl-btn" id="btn-right" aria-label="Drive Right">▶</button>
    <button class="ctrl-btn" id="btn-nitro" aria-label="Nitro">⚡</button>
    <button class="ctrl-btn" id="btn-flip"  aria-label="Flip Gravity">↕</button>
</div>

<!-- ══════════ SCREENS ══════════ -->

<!-- START -->
<div id="start-screen" class="screen">
    <h1>FORMULA<br><span>ALGORITHMIC</span></h1>
    <p class="subtitle">SPECTRAL RACER</p>
    <div class="btn-stack">
        <button class="btn btn-primary"   id="start-btn">INITIALIZE DRIVE</button>
        <button class="btn btn-secondary" id="garage-btn">SPECTRAL WORKSHOP</button>
    </div>
    <div class="key-hints">
        <div><span>A/D</span> DRIVE</div>
        <div><span>SPACE</span> FLIP GRAVITY</div>
        <div><span>N</span> NITRO</div>
    </div>
</div>

<!-- GARAGE -->
<div id="garage-screen" class="screen hidden">
    <div class="garage-title">WORKSHOP</div>
    <div id="garage-grid"></div>
    <button class="btn btn-secondary" id="garage-back-btn" style="margin-top:1.5rem;pointer-events:all;">← BACK</button>
</div>

<!-- GAME OVER -->
<div id="game-over-screen" class="screen hidden">
    <h1 id="go-title">DRIVE TERMINATED</h1>
    <div class="stats-row">
        <div class="stat-box"><span class="lbl">DISTANCE</span><div class="val" id="final-dist">0m</div></div>
        <div class="stat-box"><span class="lbl">COINS</span><div class="val" id="final-coins">0</div></div>
        <div class="stat-box"><span class="lbl">SCORE</span><div class="val" id="final-score">0</div></div>
    </div>
    <div class="btn-stack">
        <button class="btn btn-primary"   id="retry-btn">REBOOT</button>
        <button class="btn btn-secondary" id="menu-btn">MAIN TERMINAL</button>
    </div>
</div>

<!-- PAUSE -->
<div id="pause-screen" class="screen hidden">
    <h2>PAUSED</h2>
    <div class="btn-stack">
        <button class="btn btn-primary"   id="resume-btn">RESUME</button>
        <button class="btn btn-secondary" id="pause-quit-btn">QUIT</button>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="js/game.js"></script>

</body>
</html>
